[project]
name = "sbanalyze"
version = "0.1.0"
description = "Offline biomechanical analysis of snowboard jump approaches"
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "onnxruntime>=1.18",
    "rtmlib>=0.0.13",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
sbanalyze = "sbanalyze.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbanalyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
